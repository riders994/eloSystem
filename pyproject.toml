[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-system"
version = "2.0.1"
description = "Elo rating system for fantasy sports leagues (Fantrax NBA and Sleeper NFL, with multi-season dynasty support)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohan V", email = "r.vahalia@gmail.com" }]
keywords = ["elo", "fantasy", "sports", "fantrax", "sleeper", "rating"]
urls.Repository = "https://github.com/riders994/eloSystem"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "psycopg2-binary>=2.9",
    # EloSQL's connection helper, plus the anonymize/deanonymize pair added in
    # 1.2.0 and fixed for index levels in 1.2.1.
    "rv_pytools>=1.2.1",
    # The PyPI release of fantraxapi is broken for H2H-rotisserie leagues; a
    # forked copy is vendored at elo_system/_vendor/fantraxapi (see its LICENSE
    # and __init__.py for provenance). ``requests`` is its only runtime dep.
    "requests>=2.31",
]

[project.optional-dependencies]
# The Sleeper backend. SleeperScraper imports it lazily, so Fantrax-only
# installs do not need it.
sleeper = ["sleeper>=2.0"]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pyflakes>=3",
    "build>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["elo_system*"]

[tool.setuptools.package-data]
# Ship the vendored fork's MIT license inside the wheel for compliance.
"elo_system._vendor.fantraxapi" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
