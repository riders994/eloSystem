# SQL backend config (EloSQL). Copy to sql_config.yml and edit.
#
# Supply connection details in ONE of two ways:
#   1. conn_dict — a mapping of discrete connection fields (below), or
#   2. conn_uri  — a single SQLAlchemy/libpq URI string (see bottom).
# conn_dict wins if both are present.

conn_dict:
  dbname: elo            # database name (required)
  user: elo             # role/username (required)
  password: ""          # password (required; "" for none)
  host: localhost       # required
  port: 5432            # required

# Schema holding the dim_*/fact_* tables. Defaults to fantasy_sports.
# May also be set as a `schema:` key inside conn_dict.
schema: fantasy_sports

# Alternative to conn_dict — a single URI (parsed into the fields above):
# conn_uri: postgresql://elo:password@localhost:5432/elo

# Anonymizer. With this on, names are tokenised on the way into the DB and
# restored on the way out: 'Nate' in the 'manager' category is stored as
# 'manager_0'. The dim tables EloSQL holds in memory always carry real values,
# so nothing else in the system has to know about this.
anonymizer: true

# Where the reversal maps are written — one JSON file per dim (anon_manager.json,
# anon_manager_platform.json, anon_team.json ...). Defaults to resources/anon. A
# relative path is read the same way, from the resources directory; an absolute
# one is used as given.
# Loading needs these files, so keep them: without them a read comes back with
# token names. They hold the real values, so resources/ is gitignored.
# anon_loc: anon

# Which columns are tokenised, and the category each is named under. Columns
# sharing a category share tokens, which is how a manager reads the same in
# dim_manager_platform as in the fact tables' manager_name.
#
# Defaults to the identity columns, split the way the schema splits them —
# dim_manager is the person, dim_manager_platform is the account they play under
# on one platform:
#
#   manager:
#     player_name: person          # the real name the Discord side sets
#   manager_platform:
#     platform_user_id: account    # the account id the frames are keyed by
#     display_name: manager        # the name that account shows under
#
# platform_user_id and display_name get a category each because they are
# different value spaces; on Fantrax the account id *is* the owner's name, which
# is why it is tokenised at all.
#
# Anything set here is merged over that default, e.g. to cover team names too:
# anon_columns:
#   team:
#     team_name: team